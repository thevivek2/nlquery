<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NL to SQL</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        padding-top: 50px;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 700px;
        max-width: 95%;
        box-shadow: 0 0 15px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        height: 80vh;
    }

    h2 { margin-top: 0; }

    .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background: #f9f9f9;
        margin-bottom: 15px;
    }

    .message {
        margin: 8px 0;
        padding: 10px 15px;
        border-radius: 15px;
        max-width: 80%;
        word-wrap: break-word;
    }

    .user-message {
        background: #daf1ff;
        align-self: flex-end;
        text-align: right;
    }

    .bot-message {
        background: #eee;
        align-self: flex-start;
        text-align: left;
        font-family: monospace;
    }

    .input-container {
        display: flex;
    }

    input[type=text] {
        flex: 1;
        padding: 12px 15px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    button {
        margin-left: 10px;
        padding: 0 16px;
        border-radius: 5px;
        border: none;
        background-color: #4caf50;
        color: white;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    button:hover { background-color: #45a049; }

    .loading { font-style: italic; color: #666; }
</style>
</head>
<body>
<div class="container">
    <h2>NL to SQL</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-container">
        <input type="text" id="queryInput" placeholder="Type your query...">
        <button id="generateBtn">💬</button>
    </div>
</div>

<script>
async function sendQuery() {
    const inputBox = document.getElementById('queryInput');
    const chatBox = document.getElementById('chatBox');
    const query = inputBox.value.trim();
    if (!query) return;

    // Display user message
    const userDiv = document.createElement('div');
    userDiv.className = 'message user-message';
    userDiv.textContent = query;
    chatBox.appendChild(userDiv);

    // Display loading message for bot
    const botDiv = document.createElement('div');
    botDiv.className = 'message bot-message loading';
    botDiv.textContent = 'Generating SQL...';
    chatBox.appendChild(botDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
    inputBox.value = '';

    const startTime = performance.now(); // ⏱ start timing

    try {
        const response = await fetch(`/nl-to-sql?prompt=${encodeURIComponent(query)}`);
        const endTime = performance.now(); // ⏱ end timing
        const durationMs = Math.round(endTime - startTime);

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        botDiv.classList.remove('loading');
        botDiv.innerHTML = `
            <div style="font-size:12px;color:#666;margin-bottom:6px;">
                ⏱ ${(durationMs / 1000).toFixed(2)} s
            </div>
            <div>${data.sql || "No SQL generated."}</div>
        `;
    } catch (err) {
        const endTime = performance.now();
        const durationMs = Math.round(endTime - startTime);

        console.error(err);
        botDiv.classList.remove('loading');
        botDiv.innerHTML = `
            <div style="font-size:12px;color:#666;margin-bottom:6px;">
                ⏱ ${(durationMs / 1000).toFixed(2)} s
            </div>
            <div>Error generating SQL. Check console.</div>
        `;
    }

    inputBox.focus();
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Send on button click
document.getElementById('generateBtn').addEventListener('click', sendQuery);

// Send on Enter key press
document.getElementById('queryInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        sendQuery();
        e.preventDefault();
    }
});
</script>

</body>
</html>
